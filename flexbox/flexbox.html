<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="block1">
        <div class="topdiv">
            <div></div>
            <div id="topflex">
                <div class="topflexchildren"></div>
                <div class="topflexchildren"></div>
            </div>
            <div></div>
        </div>
        <div class="middiv">
            <div id="midflex1"></div>
            <div id="midflex2">
                <div></div>
                <div></div>
            </div>
        </div>
        <div class="botdiv">
            <div></div>
            <div id="botflex">
                <div></div>
                <div></div>
            </div>
            <div></div>
        </div>
    </div>
    <div class="flex_activity_container">
        <div class="item ball"></div>
        <div class="item stretch_item"></div>
        <div class="item ball"></div>
    </div>
    <div class="submission_container">
        <div class="submission_form">
            <form>
                <label class="name" for="name-field">
                Name:
                <input id="name-field" />
                </label>
                <label class="email" for="email-field">
                Email:
                <input id="email-field" type="email" />
                </label>
                <button id="flex_button">
                Submit
                </button>
            </form>
        </div>
    </div>
</body>
</html>
